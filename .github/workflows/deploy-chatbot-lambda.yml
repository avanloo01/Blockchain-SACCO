name: Deploy Chatbot Lambda

on:
  push:
    branches: [main]
    paths:
      - chatbot-lambda/**
      - .github/workflows/deploy-chatbot-lambda.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      PRISMA_LAMBDA_BINARY_TARGET: rhel-openssl-3.0.x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Install Python dependencies
        working-directory: chatbot-lambda
        run: python -m pip install -r requirements.txt

      - name: Generate Prisma client
        working-directory: chatbot-lambda
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m prisma generate --schema prisma/schema.prisma; then
              exit 0
            fi

            if [[ "$attempt" == "3" ]]; then
              echo "Prisma client generation failed after ${attempt} attempts" >&2
              exit 1
            fi

            echo "Prisma client generation failed on attempt ${attempt}, retrying..." >&2
          done

      - name: Bundle Prisma query engine
        working-directory: chatbot-lambda
        run: |
          set -euo pipefail
          engine_path="$(find "$HOME/.cache/prisma-python/binaries" -type f \( -name "query-engine-${PRISMA_LAMBDA_BINARY_TARGET}" -o -name "prisma-query-engine-${PRISMA_LAMBDA_BINARY_TARGET}" \) | head -n 1)"
          if [[ -z "$engine_path" ]]; then
            echo "Could not find Prisma query engine for ${PRISMA_LAMBDA_BINARY_TARGET} in cache" >&2
            exit 1
          fi

          cp "$engine_path" "./prisma-query-engine-${PRISMA_LAMBDA_BINARY_TARGET}"
          chmod +x "./prisma-query-engine-${PRISMA_LAMBDA_BINARY_TARGET}"

      - name: Build
        working-directory: chatbot-lambda
        run: sam build --template-file template.yaml

      - name: Deploy
        working-directory: chatbot-lambda
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "${{ secrets.SAM_STACK_NAME }}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --parameter-overrides \
              TelegramBotToken="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
              TelegramWebhookSecret="${{ secrets.TELEGRAM_WEBHOOK_SECRET }}" \
              DatabaseUrl="${{ secrets.DATABASE_URL }}" \
              PaymentProvider="crossmint" \
              SolanaTreasuryAddress="${{ secrets.SOLANA_TREASURY_ADDRESS }}" \
              CrossmintRecipientEmail="${{ secrets.CROSSMINT_RECIPIENT_EMAIL }}" \
              SolanaRpcUrl="${{ secrets.SOLANA_RPC_URL }}" \
              CrossmintServerApiKey="${{ secrets.CROSSMINT_SERVER_API_KEY }}"

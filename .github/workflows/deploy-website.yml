name: Deploy Website to Vercel

on:
  push:
    branches: [main]
    paths:
      - website-nextjs/**
      - .github/workflows/deploy-website.yml
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website-nextjs/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        working-directory: website-nextjs
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        working-directory: website-nextjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_CROSSMINT_CLIENT_API_KEY: ${{ secrets.NEXT_PUBLIC_CROSSMINT_CLIENT_API_KEY }}
          NEXT_PUBLIC_CROSSMINT_TOKEN_LOCATOR: "solana:EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
          NEXT_PUBLIC_CROSSMINT_WALLET_ADDRESS: ${{ secrets.SOLANA_TREASURY_ADDRESS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" \
            --build-env "NEXT_PUBLIC_CROSSMINT_CLIENT_API_KEY=$NEXT_PUBLIC_CROSSMINT_CLIENT_API_KEY" \
            --build-env "NEXT_PUBLIC_CROSSMINT_TOKEN_LOCATOR=$NEXT_PUBLIC_CROSSMINT_TOKEN_LOCATOR" \
            --build-env "NEXT_PUBLIC_CROSSMINT_WALLET_ADDRESS=$NEXT_PUBLIC_CROSSMINT_WALLET_ADDRESS" \
            --build-env "RESEND_API_KEY=$RESEND_API_KEY" \
            --build-env "RESEND_FROM_EMAIL=$RESEND_FROM_EMAIL" \
            --build-env "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" \
            --build-env "NEXTAUTH_URL=$NEXTAUTH_URL" \
            --build-env "SUPABASE_URL=$SUPABASE_URL" \
            --build-env "SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY" \
            --env "NEXT_PUBLIC_CROSSMINT_CLIENT_API_KEY=$NEXT_PUBLIC_CROSSMINT_CLIENT_API_KEY" \
            --env "NEXT_PUBLIC_CROSSMINT_TOKEN_LOCATOR=$NEXT_PUBLIC_CROSSMINT_TOKEN_LOCATOR" \
            --env "NEXT_PUBLIC_CROSSMINT_WALLET_ADDRESS=$NEXT_PUBLIC_CROSSMINT_WALLET_ADDRESS" \
            --env "RESEND_API_KEY=$RESEND_API_KEY" \
            --env "RESEND_FROM_EMAIL=$RESEND_FROM_EMAIL" \
            --env "NEXTAUTH_SECRET=$NEXTAUTH_SECRET" \
            --env "NEXTAUTH_URL=$NEXTAUTH_URL" \
            --env "SUPABASE_URL=$SUPABASE_URL" \
            --env "SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY"

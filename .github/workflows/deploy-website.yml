name: Deploy Website to Vercel

on:
  push:
    branches: [main]
    paths:
      - website-nextjs/**
      - .github/workflows/deploy-website.yml
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website-nextjs/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        working-directory: website-nextjs
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        working-directory: website-nextjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_CROSSMINT_CLIENT_API_KEY: ${{ secrets.NEXT_PUBLIC_CROSSMINT_CLIENT_API_KEY }}
          NEXT_PUBLIC_CROSSMINT_TOKEN_LOCATOR: "solana:EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
          NEXT_PUBLIC_CROSSMINT_WALLET_ADDRESS: ${{ secrets.SOLANA_TREASURY_ADDRESS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Build the deploy command, only passing --env for variables that are
          # non-empty. Passing --env "KEY=" would override a correctly-configured
          # Vercel project setting with an empty string, silently breaking the
          # checkout page. Server-side vars (no NEXT_PUBLIC_ prefix) only need
          # --env; the NEXT_PUBLIC_ vars are now read server-side in page.tsx,
          # so --build-env is no longer required for them.
          ARGS=(--prod --yes --token="$VERCEL_TOKEN")

          [ -n "$NEXT_PUBLIC_CROSSMINT_CLIENT_API_KEY" ] && \
            ARGS+=(--env "NEXT_PUBLIC_CROSSMINT_CLIENT_API_KEY=$NEXT_PUBLIC_CROSSMINT_CLIENT_API_KEY")
          [ -n "$NEXT_PUBLIC_CROSSMINT_TOKEN_LOCATOR" ] && \
            ARGS+=(--env "NEXT_PUBLIC_CROSSMINT_TOKEN_LOCATOR=$NEXT_PUBLIC_CROSSMINT_TOKEN_LOCATOR")
          [ -n "$NEXT_PUBLIC_CROSSMINT_WALLET_ADDRESS" ] && \
            ARGS+=(--env "NEXT_PUBLIC_CROSSMINT_WALLET_ADDRESS=$NEXT_PUBLIC_CROSSMINT_WALLET_ADDRESS")
          [ -n "$RESEND_API_KEY" ] && \
            ARGS+=(--env "RESEND_API_KEY=$RESEND_API_KEY")
          [ -n "$RESEND_FROM_EMAIL" ] && \
            ARGS+=(--env "RESEND_FROM_EMAIL=$RESEND_FROM_EMAIL")
          [ -n "$NEXTAUTH_SECRET" ] && \
            ARGS+=(--env "NEXTAUTH_SECRET=$NEXTAUTH_SECRET")
          [ -n "$NEXTAUTH_URL" ] && \
            ARGS+=(--env "NEXTAUTH_URL=$NEXTAUTH_URL")
          [ -n "$SUPABASE_URL" ] && \
            ARGS+=(--env "SUPABASE_URL=$SUPABASE_URL")
          [ -n "$SUPABASE_SERVICE_KEY" ] && \
            ARGS+=(--env "SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY")

          vercel deploy "${ARGS[@]}"

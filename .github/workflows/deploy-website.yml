name: Deploy Website to Vercel

on:
  push:
    branches: [main]
    paths:
      - website-nextjs/**
      - .github/workflows/deploy-website.yml
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website-nextjs/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Sync production env to Vercel
        working-directory: website-nextjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          sync_env() {
            local name="$1"
            local value="$2"

            if [[ -z "$value" ]]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi

            if vercel env ls production --token="$VERCEL_TOKEN" | grep -Eq "^[[:space:]]+$name[[:space:]]"; then
              vercel env update "$name" production --yes --value "$value" --token="$VERCEL_TOKEN"
            else
              printf '%s' "$value" | vercel env add "$name" production --token="$VERCEL_TOKEN"
            fi
          }

          sync_env RESEND_API_KEY "$RESEND_API_KEY"
          sync_env RESEND_FROM_EMAIL "$RESEND_FROM_EMAIL"
          sync_env NEXTAUTH_SECRET "$NEXTAUTH_SECRET"
          sync_env NEXTAUTH_URL "$NEXTAUTH_URL"
          sync_env SUPABASE_URL "$SUPABASE_URL"
          sync_env SUPABASE_SERVICE_KEY "$SUPABASE_SERVICE_KEY"

      - name: Pull Vercel environment
        working-directory: website-nextjs
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        working-directory: website-nextjs
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        working-directory: website-nextjs
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

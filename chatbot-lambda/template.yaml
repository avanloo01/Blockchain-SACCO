AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Blockchain SACCO Telegram bot Lambda stack

Parameters:
  TelegramBotToken:
    Type: String
    NoEcho: true
    Description: Telegram bot token set at deploy time
  TelegramWebhookSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional Telegram webhook secret set at deploy time
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: Supabase PostgreSQL connection URL (pooled)
  PaymentProvider:
    Type: String
    Default: moonpay
    Description: Payment provider key (moonpay, solana_testnet, solana_mainnet)
  SolanaTreasuryAddress:
    Type: String
    Default: ""
    Description: Solana wallet address for receiving USDC contributions
  SolanaRpcUrl:
    Type: String
    Default: "https://api.devnet.solana.com"
    Description: Solana JSON-RPC endpoint
  MoonpayApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: MoonPay publishable API key for on-ramp widget
  MoonpaySecretKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: MoonPay secret API key for transaction verification

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        APP_ENV: dev
        TELEGRAM_API_BASE: https://api.telegram.org
        TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
        TELEGRAM_WEBHOOK_SECRET: !Ref TelegramWebhookSecret
        DATABASE_URL: !Ref DatabaseUrl
        GOVERNANCE_THRESHOLD_USD: "100"
        POOL_UTILIZATION_CAP_PERCENT: "60"
        SERVICE_FEE_PERCENT: "1.0"
        PAYMENT_PROVIDER: !Ref PaymentProvider
        SOLANA_TREASURY_ADDRESS: !Ref SolanaTreasuryAddress
        SOLANA_RPC_URL: !Ref SolanaRpcUrl
        MOONPAY_API_KEY: !Ref MoonpayApiKey
        MOONPAY_SECRET_KEY: !Ref MoonpaySecretKey
        MOONPAY_WALLET_ADDRESS: !Ref SolanaTreasuryAddress

Resources:
  TelegramWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.app.lambda_handler
      Events:
        TelegramWebhook:
          Type: Api
          Properties:
            Path: /telegram/webhook
            Method: post

  MonthlyContributionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.scheduled.monthly_contribution_handler
      Events:
        MonthlyContributionSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 7 1 * ? *)

  RepaymentReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.scheduled.repayment_reminder_handler
      Events:
        DailyRepaymentSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 7 * * ? *)

  PaymentReconciliationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.scheduled.payment_reconciliation_handler
      Timeout: 60
      Events:
        ReconciliationSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 6 * * ? *)

Outputs:
  WebhookApiEndpoint:
    Description: API Gateway endpoint for Telegram webhook
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/telegram/webhook"

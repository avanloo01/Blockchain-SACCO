AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Blockchain SACCO Telegram bot Lambda stack

Parameters:
  TelegramBotToken:
    Type: String
    NoEcho: true
    Description: Telegram bot token set at deploy time
  TelegramWebhookSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional Telegram webhook secret set at deploy time
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: Supabase PostgreSQL connection URL (pooled)
  PaymentProvider:
    Type: String
    Default: crossmint
    Description: Payment provider key (crossmint, solana_testnet, solana_mainnet)
  SolanaTreasuryAddress:
    Type: String
    Default: ""
    Description: Solana wallet address for receiving USDC contributions
  CrossmintWalletAddress:
    Type: String
    Default: ""
    Description: Solana wallet address for the SACCO treasury recipient in Crossmint checkout
  CrossmintTokenLocator:
    Type: String
    Default: "solana:EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
    Description: Crossmint token locator for the asset sold in the embedded checkout (chain:mintAddress)
  SolanaRpcUrl:
    Type: String
    Default: "https://api.devnet.solana.com"
    Description: Solana JSON-RPC endpoint
  CrossmintServerApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Crossmint server-side API key for headless checkout and order reads
  WebsiteUrl:
    Type: String
    Default: "https://lemaiyanlabs.org"
    Description: Public URL of the Next.js website (used to build checkout links)

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        APP_ENV: dev
        TELEGRAM_API_BASE: https://api.telegram.org
        TELEGRAM_BOT_TOKEN: !Ref TelegramBotToken
        TELEGRAM_WEBHOOK_SECRET: !Ref TelegramWebhookSecret
        DATABASE_URL: !Ref DatabaseUrl
        GOVERNANCE_THRESHOLD_USD: "100"
        POOL_UTILIZATION_CAP_PERCENT: "60"
        SERVICE_FEE_PERCENT: "1.0"
        PAYMENT_PROVIDER: !Ref PaymentProvider
        SOLANA_TREASURY_ADDRESS: !Ref SolanaTreasuryAddress
        SOLANA_RPC_URL: !Ref SolanaRpcUrl
        PRISMA_QUERY_ENGINE_BINARY: /var/task/prisma-query-engine-rhel-openssl-3.0.x
        CROSSMINT_SERVER_API_KEY: !Ref CrossmintServerApiKey
        CROSSMINT_WALLET_ADDRESS: !Ref CrossmintWalletAddress
        CROSSMINT_TOKEN_LOCATOR: !Ref CrossmintTokenLocator
        WEBSITE_URL: !Ref WebsiteUrl

Resources:
  TelegramWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.app.lambda_handler
      Events:
        TelegramWebhook:
          Type: Api
          Properties:
            Path: /telegram/webhook
            Method: post

  MonthlyContributionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.scheduled.monthly_contribution_handler
      Events:
        MonthlyContributionSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 7 1 * ? *)

  RepaymentReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.scheduled.repayment_reminder_handler
      Events:
        DailyRepaymentSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 7 * * ? *)

  PaymentReconciliationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src.scheduled.payment_reconciliation_handler
      Timeout: 60
      Events:
        ReconciliationSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 6 * * ? *)

Outputs:
  WebhookApiEndpoint:
    Description: API Gateway endpoint for Telegram webhook
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/telegram/webhook"
